main{max-width:560px;margin:0 auto;padding:12px 12px 150px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.nav button,.tabs button,.mini{border:0;background:var(--card);color:var(--tx);border-radius:12px;font-size:20px;padding:10px 16px;box-shadow:0 0 0 1px var(--ln)}
.ttl{text-align:center;flex:1}.ttl b{font-size:20px;display:block}.ttl span{color:var(--mut);font-size:14px}

.set{width:52px;height:52px;border-radius:50%;border:2px solid var(--ac);background:none;color:var(--ac);font-size:18px;font-weight:700}
.set.on{background:var(--ok);border-color:var(--ok);color:#fff}
.row{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mut)}

.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--ln)}
.tabs button{flex:1;font-size:14px;padding:12px 2px}.tabs button.a{background:var(--ac);color:#fff}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;margin-bottom:6px;border-radius:12px;background:var(--card);box-shadow:0 0 0 1px var(--ln);font-size:15px}
.li small{color:var(--mut)}.li.cur{box-shadow:0 0 0 2px var(--ac)}.wk{margin:14px 4px 6px;color:var(--mut);font-size:13px;font-weight:600}

#tm b{font-size:28px;font-variant-numeric:tabular-nums}#tm button{border:0;background:rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:8px 12px;font-size:16px;margin-left:6px}

textarea{width:100%;height:120px;margin-top:8px;font-size:12px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px}
.note{color:var(--mut);font-size:13px;line-height:1.4;margin:6px 4px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}

.mini{margin:4px 0}

   var key=d[0]+"|"+k,a=S.s[key]||[],w=dg(S.w[key]),r=dg(S.r[key]),ld=e[3]?" · "+e[3]:"",pw=pn(e[3]),pr=/^\d+$/.test(e[2])?+e[2]:null;
   if(S.k[key]){h+='<div class="card sk"><div class="hd"><h3>'+(k+1)+'. '+e[0]+'</h3></div><button class="btn big" onclick="skp('+k+')">Выполнить</button></div>';return}
   h+='<div class="card"><div class="hd"><h3>'+(k+1)+'. '+e[0]+'</h3><button class="mini sm" onclick="skp('+k+')">Пропустить</button></div><div class="plan">'+e[1]+'×'+e[2]+ld+'</div>'+(e[4]?'<div class="tag">'+e[4]+'</div>':'')+'<div class="sets">';
   for(var j=0;j<e[1];j++)h+='<button class="set'+(a[j]?' on':'')+'" onclick="tap('+k+','+j+')">'+(a[j]?'✓':j+1)+'</button>';
   h+='</div><div class="row2"><label>Вес, кг<input class="'+cl(w,pw)+'" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" placeholder="'+(pw==null?"":pw)+'" value="'+w+'" oninput="fld(this,0,'+k+')"></label><label>Повторы<input class="'+cl(r,pr)+'" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" placeholder="'+(pr==null?"":pr)+'" value="'+r+'" oninput="fld(this,1,'+k+')"></label></div></div>'});
  var fn=!!S.f[d[0]];
  h+='<button class="btn" style="'+(fn?'background:var(--ok)':'')+'" onclick="fin()">'+(fn?'✓ Тренировка завершена (нажмите, чтобы отменить)':'Завершить тренировку')+'</button><p class="note" id="st">'+ST+'</p>';

   var n=dn(i),T=tot(i),m=S.f[d[0]]?"✓":(n?n+"/"+T:""),f=d[2][0];

   h+='<div class="li"><span>'+d[3]+' · <b>День '+d[1]+'</b><br><small>'+(ws||"без заметок")+'</small></span><b>'+(S.f[d[0]]?"✓ ":"")+n+'/'+tot(i)+'</b></div>'});

/* ===== Экспорт ===== */
function csv(){
 var L=["профиль,тренировка,день,упражнение,план,выполнено подходов,всего подходов,вес,повторы"];
 D.forEach(function(d,i){if(!dn(i)&&!S.f[d[0]])return;d[2].forEach(function(e,k){var key=d[0]+"|"+k,a=(S.s[key]||[]).filter(Boolean).length,w=dg(S.w[key]),rr=dg(S.r[key]);if(S.k[key]){a=0;w="пропущено";rr=""}
  L.push([P.n.replace(/,/g," "),d[3],d[1],e[0].replace(/,/g," "),e[1]+"×"+e[2]+(e[3]?" ("+e[3]+")":""),a,e[1],w,rr].join(","))})});
 return L.join("\n")}
function exp(){var t=csv(),ta=document.getElementById("ta");ta.style.display="block";ta.value=t;ta.select();try{navigator.clipboard.writeText(t)}catch(e){}}
async function sv(){
 var m=document.getElementById("svs");
 try{var dl=window.claude&&await window.claude.use("downloads");
  if(!dl){m.textContent="Сохранение файла недоступно. Используйте «Скопировать текстом»";return}
  var n=new Date(),nm="trenirovki_"+n.getFullYear()+"-"+("0"+(n.getMonth()+1)).slice(-2)+"-"+("0"+n.getDate()).slice(-2)+".csv";
  await dl.save({filename:nm,data:"\uFEFF"+csv()});m.textContent="✓ Файл сохранён: "+nm
 }catch(e){m.textContent=(e&&e.code=="declined")?"Сохранение отменено":"Не удалось сохранить файл. Используйте «Скопировать текстом»"}}
/* ===== Таймер ===== */
function fmt(s){return Math.floor(s/60)+":"+("0"+s%60).slice(-2)}
function startT(s){left=s;document.getElementById("tm").style.display="flex";clearInterval(iv);tick();iv=setInterval(function(){left--;tick()},1000)}
function tick(){if(left<=0){stopT();beep();return}document.getElementById("tt").textContent=fmt(left)}
function adj(x){left=Math.max(5,left+x);tick()}
function stopT(){clearInterval(iv);document.getElementById("tm").style.display="none"}
function beep(){try{var c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();setTimeout(function(){o.stop()},400);if(navigator.vibrate)navigator.vibrate(300)}catch(e){}}
/* ===== Облако ===== */
function setST(t){ST=t;var e=document.getElementById("st");if(e)e.textContent=t}
function kick(){if(!D.length||!S.f[D[idx][0]])return;clearTimeout(pt);pt=setTimeout(function(){push(P)},1500)}
function push(p){
 if(!p)return Promise.resolve();
 if(!CL){setST("Облако недоступно: данные только на этом телефоне");return Promise.resolve()}
 p.u=p.u||Date.now();setST("Синхронизация…");
 return CL.doc("p_"+p.id).set({u:p.u,j:JSON.stringify({n:p.n,a:p.a,pr:p.pr,tb:p.tb,st:p.st})}).then(function(){setST("✓ Сохранено в облаке")}).catch(function(){setST("Ошибка синхронизации. Проверьте интернет и повторите")})}
function fin(){var d=D[idx][0];if(S.f[d])delete S.f[d];else{S.f[d]=Date.now();stopT()}save();ST="Синхронизация…";render();push(P)}
(async function(){try{
 var c=window.claude;if(!c)return;
 var u=await c.use("user"),d=await c.use("db");
 if(!u||!d){setST("Облако недоступно: войдите в claude.ai. Данные только на телефоне");return}
 CL=d.collection("data/users/"+await u.id());
 var sn=await CL.get(),ch=false,have={};
 sn.docs.forEach(function(x){var v=x.data();if(!v||!v.j)return;var o;try{o=JSON.parse(v.j)}catch(e){return}
  if(x.id.indexOf("p_")==0){var pid=x.id.slice(2),l=DB.p[pid];have[pid]=v.u;
   if(!l||(l.u||0)<v.u){DB.p[pid]={id:pid,n:o.n,a:o.a,pr:o.pr,tb:o.tb,st:norm(o.st),u:v.u};ch=true}}
  else if(x.id.indexOf("w_")==0&&v.iso){var L=DB.p.xl.st,k;if(L.f[v.iso])return;
   for(k in o.s)L.s[v.iso+"|"+k]=o.s[k];for(k in o.w)L.w[v.iso+"|"+k]=o.w[k];for(k in o.r)L.r[v.iso+"|"+k]=o.r[k];for(k in o.k)if(o.k[k])L.k[v.iso+"|"+k]=1;L.f[v.iso]=v.f;ch=true}});
 if(ch){var keep=navd,ix=idx,cur=DB.p[P.id]?P.id:"xl";use(cur);if(keep){idx=Math.min(ix,D.length-1);navd=true}save();render()}
 setST("✓ Облако подключено");
 for(var id in DB.p){if(have[id]==null||(DB.p[id].u||0)>have[id])await push(DB.p[id])}
}catch(e){setST("Облако недоступно: данные только на телефоне")}})();
use(DB.cur&&DB.p[DB.cur]?DB.cur:"xl");
render();
</script>
